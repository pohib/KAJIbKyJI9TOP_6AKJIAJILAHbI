name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types:
      - checks_requested
permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check app tests

      - name: Ruff (format check)
        run: ruff format --check app tests

      - name: Pytest
        run: pytest -q

      - name: Bandit
        run: bandit -r app -c pyproject.toml

  security:
    name: Сканы безопасности
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Проверка
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Усыновить python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Скан Semgrep
        run: |
          pip install semgrep
          semgrep ci \
            --config p/owasp-top-ten \
            --config p/cwe-top-25 \
            --config p/github-actions \
            --sarif --output semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Выложить результаты Semgrep в виде SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Собрать образ для скана
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t calcapi:scan .

      - name: Скан образа с Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: calcapi:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Выложить отчет образа Trivy в виде SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Сканирование ФС с Trivy 
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Выложить Trivy отчет о ФС в виде SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Сохранить репорты как артефакты
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          path: |
            semgrep.sarif
            trivy-image.sarif
            trivy-fs.sarif
          retention-days: 30
  
  release:
    name: Build, tag, publish
    needs: [test, security]
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Рассчитать версию
        id: version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

          default_bump: false

          release_branches: main
          tag_prefix: v

          custom_release_rules: |
            fix:patch
            refactor:patch
            feat:minor

      - name: Показать рассчитанную версию
        run: |
          echo "Release type: ${{ steps.version.outputs.release_type }}"
          echo "Previous tag: ${{ steps.version.outputs.previous_tag }}"
          echo "New version:  ${{ steps.version.outputs.new_version }}"
          echo "New tag:      ${{ steps.version.outputs.new_tag }}"

      - name: Проверить необходимость релиза
        if: steps.version.outputs.new_version == ''
        run: |
          echo "Новый релиз не требуется."
          exit 0

      - name: Подготовить имя Docker-образа
        if: steps.version.outputs.new_version != ''
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "Docker image: ghcr.io/${GITHUB_REPOSITORY,,}"

      - name: Собрать Docker image
        if: steps.version.outputs.new_version != ''
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.new_version }} \
            -t "$IMAGE_NAME:${{ steps.version.outputs.new_version }}" \
            -t "$IMAGE_NAME:latest" \
            .

      - name: Smoke-тест контейнера
        if: steps.version.outputs.new_version != ''
        run: |
          docker run -d --rm \
            -p 8000:8000 \
            --name calcapi \
            "$IMAGE_NAME:${{ steps.version.outputs.new_version }}"

          echo "Ожидание запуска приложения..."

          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              break
            fi

            if [ "$i" -eq 15 ]; then
              echo "Приложение не запустилось"
              docker logs calcapi
              exit 1
            fi

            sleep 1
          done

          echo "Health:"
          curl -f http://localhost:8000/health
          echo

          echo "Version:"
          curl -f http://localhost:8000/ | tee /tmp/root.json
          echo

          EXPECTED="${{ steps.version.outputs.new_version }}"
          ACTUAL=$(grep -oE '"version":"[^"]+"' /tmp/root.json | cut -d'"' -f4)

          echo "Ожидалось: $EXPECTED"
          echo "Получено:   $ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Версия не совпала"
            docker logs calcapi
            exit 1
          fi

          echo "Smoke test OK"

          docker stop calcapi

      - name: Создать Git tag
        if: steps.version.outputs.new_version != ''
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

          default_bump: false

          release_branches: main
          tag_prefix: v

          custom_release_rules: |
            fix:patch
            refactor:patch
            feat:minor

      - name: Показать созданный tag
        if: steps.tag.outputs.new_tag != ''
        run: |
          echo "Создан tag: ${{ steps.tag.outputs.new_tag }}"
          echo "Версия:     ${{ steps.tag.outputs.new_version }}"
          echo "Предыдущий: ${{ steps.tag.outputs.previous_tag }}"

      - name: Логин в GHCR
        if: steps.version.outputs.new_version != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: steps.version.outputs.new_version != ''
        run: |
          docker push "$IMAGE_NAME:${{ steps.version.outputs.new_version }}"
          docker push "$IMAGE_NAME:latest"

          echo "Опубликовано:"
          echo "$IMAGE_NAME:${{ steps.version.outputs.new_version }}"
          echo "$IMAGE_NAME:latest"
