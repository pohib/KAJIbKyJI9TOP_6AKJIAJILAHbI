name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check app tests

      - name: Ruff (format check)
        run: ruff format --check app tests

      - name: Pytest
        run: pytest -q

      - name: Bandit
        run: bandit -r app -c pyproject.toml

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      version: ${{ steps.tag.outputs.new_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Подготовить имя Docker-образа
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "Docker image: ghcr.io/${GITHUB_REPOSITORY,,}"

      - name: Автотег по Conventional Commits
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

      - name: Версия
        run: |
          echo "Новая версия: ${{ steps.tag.outputs.new_version }}"
          echo "Предыдущий тег: ${{ steps.tag.outputs.previous_tag }}"

      - name: Собрать образ
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.tag.outputs.new_version }} \
            -t "$IMAGE_NAME:${{ steps.tag.outputs.new_version }}" \
            -t "$IMAGE_NAME:latest" \
            .

      - name: Smoke-тест контейнера
        run: |
          docker run -d --rm -p 8000:8000 --name calcapi \
            "$IMAGE_NAME:${{ steps.tag.outputs.new_version }}"

          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done

          echo "health"
          curl -f http://localhost:8000/health
          echo

          echo "версия"
          curl -f http://localhost:8000/ | tee /tmp/root.json
          echo

          EXPECTED="${{ steps.tag.outputs.new_version }}"
          ACTUAL=$(grep -oE '"version":"[^"]+"' /tmp/root.json | cut -d'"' -f4)

          echo "Ожидалось: $EXPECTED  Получено: $ACTUAL"

          [ "$EXPECTED" = "$ACTUAL" ] || {
            echo "Версия не совпала"
            exit 1
          }

          docker stop calcapi

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Подготовить имя Docker-образа
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "Docker image: ghcr.io/${GITHUB_REPOSITORY,,}"

      - name: Логин в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Пересобрать и запушить
        run: |
          docker build \
            --build-arg APP_VERSION=${{ needs.build.outputs.version }} \
            -t "$IMAGE_NAME:${{ needs.build.outputs.version }}" \
            -t "$IMAGE_NAME:latest" \
            .

          docker push "$IMAGE_NAME:${{ needs.build.outputs.version }}"
          docker push "$IMAGE_NAME:latest"
